set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',*:RGB'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_background '#{@thm_bg}'
set -g @catppuccin_window_text ' #W#{?window_zoomed_flag, (+),}'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag, (+),}'
set -g @catppuccin_date_time_text ' %a %b %d %H:%M'

if 'test ! -f ~/.config/tmux/plugins/catppuccin/catppuccin.tmux' \
  'run "mkdir -p ~/.config/tmux/plugins/catppuccin && git clone -b v2.3.1 https://github.com/catppuccin/tmux.git ~/.config/tmux/plugins/catppuccin"'
run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux

set -g status-interval 60
set -g status-left-length 100
set -g status-left ''
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_date_time}'
set -g message-style 'fg=#{@thm_green},bg=#{@thm_bg},fill=#{@thm_bg},align=left'

set -g mouse on
set -g set-clipboard on
set -g focus-events on

set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-hook -g session-created 'run-shell "tmux move-window -r -t #{session_name}"'

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator#disable-wrapping
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n 'M-H' if "$is_vim" { send-keys M-H } { if -F '#{pane_at_left}'   {} { select-pane -L } }
bind -n 'M-J' if "$is_vim" { send-keys M-J } { if -F '#{pane_at_bottom}' {} { select-pane -D } }
bind -n 'M-K' if "$is_vim" { send-keys M-K } { if -F '#{pane_at_top}'    {} { select-pane -U } }
bind -n 'M-L' if "$is_vim" { send-keys M-L } { if -F '#{pane_at_right}'  {} { select-pane -R } }
bind -T copy-mode-vi 'M-H' if -F '#{pane_at_left}'   {} { select-pane -L }
bind -T copy-mode-vi 'M-J' if -F '#{pane_at_bottom}' {} { select-pane -D }
bind -T copy-mode-vi 'M-K' if -F '#{pane_at_top}'    {} { select-pane -U }
bind -T copy-mode-vi 'M-L' if -F '#{pane_at_right}'  {} { select-pane -R }

bind -r h swap-pane -t '{left-of}'
bind -r j swap-pane -t '{down-of}'
bind -r k swap-pane -t '{up-of}'
bind -r l swap-pane -t '{right-of}'

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10
bind -n M-t new-window -c "#{pane_current_path}"

bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'

bind N command-prompt -p "New session name:" { if -F "#{==:%1,}" { new-session } { new-session -s "%1" } }
bind X switch-client -n \; run-shell "tmux kill-session -t '#{session_name}'"

bind r source-file ~/.config/tmux/tmux.conf \; display 'config reloaded'

set-window-option -g mode-keys vi

bind -n 'C-x' if "$is_vim" { send-keys C-x } { copy-mode }
# Pressing C-x again leaves copy mode and passes C-x through to the app
bind -T copy-mode-vi C-x send -X cancel \; send-keys C-x
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# Visual modes. Pressing the key for the current mode exits it; pressing another switches to it.
%hidden sel='#{||:#{selection_present},#{selection_active}}'
bind -T copy-mode-vi v   if -F "#{&&:$sel,#{rectangle_toggle}}" { send -X rectangle-off } {
  if -F "#{&&:$sel,#{==:#{selection_mode},char}}" { send -X clear-selection } { send -X rectangle-off ; send -X begin-selection } }
bind -T copy-mode-vi V   if -F "#{&&:$sel,#{==:#{selection_mode},line}}" { send -X clear-selection } { send -X rectangle-off ; send -X select-line }
bind -T copy-mode-vi C-v if -F "#{&&:$sel,#{rectangle_toggle}}" { send -X clear-selection } {
  if -F "#{&&:$sel,#{==:#{selection_mode},char}}" { send -X rectangle-on } { send -X rectangle-on ; send -X begin-selection } }

# Text objects: i/a take the next key as the object while selecting; otherwise they leave copy mode
bind -T copy-mode-vi i if -F "$sel" { switch-client -T copy-mode-vi-inner }  { send -X cancel }
bind -T copy-mode-vi a if -F "$sel" { switch-client -T copy-mode-vi-around } { send -X cancel }

bind -T copy-mode-vi-inner  w send -X select-word
bind -T copy-mode-vi-around w send -X clear-selection \; send -X cursor-right \; send -X previous-word  \; send -X begin-selection \; send -X next-word  \; send -X cursor-left
bind -T copy-mode-vi-inner  W send -X clear-selection \; send -X cursor-right \; send -X previous-space \; send -X begin-selection \; send -X next-space-end
bind -T copy-mode-vi-around W send -X clear-selection \; send -X cursor-right \; send -X previous-space \; send -X begin-selection \; send -X next-space \; send -X cursor-left

bind -T copy-mode-vi-inner  p {
  send -X previous-paragraph ; if -F '#{==:#{copy_cursor_line},}' { send -X cursor-down }
  send -X select-line
  send -X next-paragraph     ; if -F '#{==:#{copy_cursor_line},}' { send -X cursor-up }
}
bind -T copy-mode-vi-around p {
  send -X previous-paragraph ; if -F '#{==:#{copy_cursor_line},}' { send -X cursor-down }
  send -X select-line
  send -X next-paragraph
}

bind -T copy-mode-vi-inner  '"' send -X jump-to-backward '"' \; send -X begin-selection \; send -X jump-to-forward '"'
bind -T copy-mode-vi-around '"' send -X jump-backward    '"' \; send -X begin-selection \; send -X jump-forward    '"'
bind -T copy-mode-vi-inner  "'" send -X jump-to-backward "'" \; send -X begin-selection \; send -X jump-to-forward "'"
bind -T copy-mode-vi-around "'" send -X jump-backward    "'" \; send -X begin-selection \; send -X jump-forward    "'"
bind -T copy-mode-vi-inner  '`' send -X jump-to-backward '`' \; send -X begin-selection \; send -X jump-to-forward '`'
bind -T copy-mode-vi-around '`' send -X jump-backward    '`' \; send -X begin-selection \; send -X jump-forward    '`'
bind -T copy-mode-vi-inner  (   send -X jump-to-backward (   \; send -X begin-selection \; send -X jump-to-forward )
bind -T copy-mode-vi-around (   send -X jump-backward    (   \; send -X begin-selection \; send -X jump-forward    )
bind -T copy-mode-vi-inner  '[' send -X jump-to-backward '[' \; send -X begin-selection \; send -X jump-to-forward ']'
bind -T copy-mode-vi-around '[' send -X jump-backward    '[' \; send -X begin-selection \; send -X jump-forward    ']'
bind -T copy-mode-vi-inner  '{' send -X jump-to-backward '{' \; send -X begin-selection \; send -X jump-to-forward '}'
bind -T copy-mode-vi-around '{' send -X jump-backward    '{' \; send -X begin-selection \; send -X jump-forward    '}'
bind -T copy-mode-vi-inner  '<' send -X jump-to-backward '<' \; send -X begin-selection \; send -X jump-to-forward '>'
bind -T copy-mode-vi-around '<' send -X jump-backward    '<' \; send -X begin-selection \; send -X jump-forward    '>'

bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set mouse off \;\
  set status off \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u mouse \;\
  set status on \;\
  refresh-client -S
